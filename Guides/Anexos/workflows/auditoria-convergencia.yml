# Auditoría de convergencia entre las ramas de release y la línea principal.
#
# Detecta el error más caro del modelo: una corrección aplicada en una rama de release que nunca
# volvió a `main`. Cuando eso pasa, el defecto reaparece en la versión siguiente y nadie entiende
# por qué, porque en la release figura corregido.
#
# El control se apoya en `git cherry`, que compara por **contenido** del cambio y no por SHA —tras
# un cherry-pick el hash siempre difiere—. Los commits marcados con `+` están en la release y no
# tienen equivalente en `main`.
name: Auditoría de convergencia

on:
  schedule:
    # Todos los días a las 06:15 UTC (03:15 en Argentina).
    - cron: '15 6 * * *'
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auditar:
    name: Convergencia release → main
    runs-on: [self-hosted, i7infra-dev]
    timeout-minutes: 10
    steps:
      - name: Descargar el código con historia completa
        uses: actions/checkout@v7
        with:
          # `git cherry` necesita la historia entera: con un clon superficial no puede comparar.
          fetch-depth: 0

      - name: Revisar cada rama de release viva
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'

          ramas="$(git branch -r --list 'origin/release/*' | sed 's|^ *||')"
          if [ -z "$ramas" ]; then
            echo "No hay ramas de release vivas; nada que auditar."
            echo "Sin ramas de release vivas." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          divergencias=0
          {
            echo "## Auditoría de convergencia"
            echo
            echo "| Rama de release | Commits sin equivalente en main |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for rama in $ramas; do
            # `+` = el cambio no está en main; `-` = ya está.
            # Un retorno resuelto a mano deja el contenido distinto y el commit marcado `+` para
            # siempre. La única forma declarada de explicarlo es la línea `Convergencia:` en el
            # mensaje del commit de la release; esos se excluyen para que el rojo signifique
            # siempre lo mismo.
            huerfanos="$(git cherry origin/main "$rama" | grep '^+' \
              | while read -r marca sha; do
                  git log -1 --format=%B "$sha" | grep -q '^Convergencia:' || echo "$marca $sha"
                done || true)"
            cantidad="$(printf '%s' "$huerfanos" | grep -c '^+' || true)"
            echo "| \`$rama\` | $cantidad |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$cantidad" -gt 0 ]; then
              divergencias=$((divergencias + cantidad))
              echo "::group::$rama — $cantidad commit(s) sin retorno a main"
              while read -r marca sha; do
                [ -n "${sha:-}" ] || continue
                echo "::error::$rama :: $sha :: $(git log -1 --format=%s "$sha")"
              done <<< "$huerfanos"
              echo "::endgroup::"
            fi
          done

          if [ "$divergencias" -gt 0 ]; then
            {
              echo
              echo "Hay $divergencias commit(s) presentes en una rama de release y ausentes en"
              echo "\`main\`. Cada uno es un hotfix sin retorno: si no se lleva a la línea principal,"
              echo "el defecto reaparece en la próxima versión."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Convergencia verificada: toda corrección de release tiene equivalente en main."
