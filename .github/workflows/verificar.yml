name: Verificar

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentacion:
    name: Enlaces y forma de la ia-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/verificar.py
